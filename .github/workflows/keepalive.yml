name: Keep backend awake

# Ping endpoint /api/health mỗi ~10 phút để Render (free) không ngủ.
# /api/health KHÔNG truy vấn DB nên không làm tốn compute của Neon.
# Lưu ý: GitHub chỉ chạy cron từ NHÁNH MẶC ĐỊNH, và tự tắt lịch nếu repo
# không có hoạt động trong 60 ngày.

on:
  schedule:
    - cron: '*/10 * * * *'   # mỗi 10 phút (UTC)
  workflow_dispatch: {}       # cho phép bấm chạy tay

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="https://quanlycongno.onrender.com/api/health"
          echo "Ping $URL lúc $(date -u)"
          # Thử tối đa 3 lần (lần đầu có thể chậm vì cold start ~30-50s)
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || echo "000")
            echo "Lần $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "✅ Backend đang thức."
              exit 0
            fi
            sleep 15
          done
          echo "⚠️ Không nhận được 200 sau 3 lần thử (backend có thể vẫn đang khởi động)."
