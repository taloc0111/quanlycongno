# docker-compose cho worker canh giá / check vé (chạy trên Ubuntu server cloud).
#
# Cách dùng:
#   1) cp .env.example .env   → điền DATABASE_URL, JWT_SECRET, WORKER_SECRET, RESEND_API_KEY...
#   2) sửa Caddyfile: đổi worker.your-domain.com thành domain thật + trỏ DNS A record về IP server
#   3) docker compose up -d --build
#   4) docker compose logs -f worker   → thấy "Fare worker HTTP nghe ở cổng 6000"
#   5) trên Render (API): đặt WORKER_URL=https://worker.your-domain.com và WORKER_SECRET (giống .env)
#
# Chưa có domain? Bỏ service caddy, mở `ports: ["6000:6000"]` ở worker rồi đặt
# WORKER_ALLOW_INSECURE=true để test (KHÔNG dùng lâu dài — secret đi qua HTTP trần).

services:
  worker:
    build: .
    image: qlcn-fare-worker
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      AUTO_MIGRATE: "false"      # chỉ web API áp schema, tránh 2 tiến trình giành nhau
      WORKER_PORT: "6000"
    expose:
      - "6000"                   # chỉ mở trong mạng nội bộ compose (Caddy gọi vào)
    shm_size: "1gb"              # dư cho Chromium (code đã bật --disable-dev-shm-usage)
    # Muốn test trực tiếp không qua Caddy thì bỏ comment dòng dưới:
    # ports:
    #   - "6000:6000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [worker]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
