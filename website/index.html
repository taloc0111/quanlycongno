<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <title>Hệ Thống Quản Lý Công Nợ</title>
    <script>
      // Đặt theme sáng/tối TRƯỚC khi app tải để không bị nháy trắng (logic giống src/theme.js).
      (function () {
        try {
          var p = localStorage.getItem('theme');
          var dark = p === 'dark' || ((p !== 'light') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) { document.documentElement.classList.add('dark'); document.documentElement.style.colorScheme = 'dark'; }
        } catch (e) { /* localStorage bị chặn: dùng sáng */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
